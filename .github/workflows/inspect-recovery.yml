name: Inspect recoverable final assets

on:
  push:
    paths:
      - RECOVER_INSPECT

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect historical report and notebook payloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/reports /tmp/notebooks
          for i in 000 001 002 003; do
            git show 24aea71dcaa4905aaee0e322b60b13ab0c7aa809:.stage/reports_${i} >> /tmp/reports.b64
          done
          base64 -d /tmp/reports.b64 > /tmp/reports.xz
          xz -dc /tmp/reports.xz > /tmp/reports.tar
          tar -xf /tmp/reports.tar -C /tmp/reports
          echo '=== REPORT FILES ==='
          find /tmp/reports -type f -maxdepth 2 -printf '%P %s bytes\n' | sort
          echo '=== REPORT SHA256 ==='
          find /tmp/reports -type f -maxdepth 2 -print0 | sort -z | xargs -0 sha256sum
          git show e4f1b3d7deeb4a5df2d8e91bd9aa2fd605359736:.stage/notebooks.b64 > /tmp/notebooks.b64
          base64 -d /tmp/notebooks.b64 > /tmp/notebooks.xz
          xz -dc /tmp/notebooks.xz > /tmp/notebooks.tar
          tar -xf /tmp/notebooks.tar -C /tmp/notebooks
          echo '=== NOTEBOOK SOURCE FILES ==='
          find /tmp/notebooks -type f -maxdepth 2 -printf '%P %s bytes\n' | sort
          echo '=== NOTEBOOK SOURCE SHA256 ==='
          find /tmp/notebooks -type f -maxdepth 2 -print0 | sort -z | xargs -0 sha256sum
