name: Final clean project repository

on:
  push:
    paths:
      - FINAL_CLEAN_NOW

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild, verify, and publish final project
        shell: bash
        run: |
          set -euo pipefail

          echo '1/8 Reconstructing canonical project source package'
          cat .package/chunk_000 .package/gap_000 .package/gap_001 .package/gap_002 .package/chunk_001 .package/tail_000 .package/tail_001 .package/tail_002 .package/tail_003 .package/tail_004 > /tmp/source.b64
          base64 -d /tmp/source.b64 > /tmp/source.tar.xz
          mkdir -p /tmp/source
          xz -dc /tmp/source.tar.xz | tar -xf - -C /tmp/source

          echo '2/8 Installing reproducibility and report dependencies'
          python -m pip install --upgrade pip
          python -m pip install -r /tmp/source/requirements.txt python-docx reportlab
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer fonts-liberation poppler-utils

          echo '3/8 Preparing clean build workspace'
          rm -rf /tmp/project
          mkdir -p /tmp/project
          cp -a /tmp/source/. /tmp/project/
          cd /tmp/project
          mkdir -p assets build

          echo '4/8 Executing all three notebooks and producing report assets'
          python build_nb1_assets.py
          PROJECT_BUILD_DIR="$PWD/assets" jupyter nbconvert --to notebook --execute --inplace 01_data_representation.ipynb --ExecutePreprocessor.timeout=900
          PROJECT_BUILD_DIR="$PWD/assets" jupyter nbconvert --to notebook --execute --inplace 02_grouped_cv_model_selection.ipynb --ExecutePreprocessor.timeout=1200
          PROJECT_BUILD_DIR="$PWD/assets" jupyter nbconvert --to notebook --execute --inplace 03_final_ranking_stage2.ipynb --ExecutePreprocessor.timeout=900

          echo '5/8 Cross-checking reproduced analytical results'
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          a=Path('assets')
          s=pd.read_csv(a/'table_12_retained_cv_summary.csv')
          best=s.iloc[0]
          assert best['config']=='ridge_a10_text_only', best.to_dict()
          assert abs(float(best['mean_ndcg10'])-0.959602) < 1e-5, best.to_dict()
          assert abs(float(best['std_ndcg10'])-0.032527) < 1e-5, best.to_dict()
          assert abs(float(best['mean_map10'])-1.0) < 1e-12
          assert abs(float(best['mean_mrr'])-1.0) < 1e-12
          bm=pd.read_csv(a/'table_15_bm25_tfidf_summary.csv')
          vals=dict(zip(bm.iloc[:,0],bm.iloc[:,1]))
          assert abs(float(vals['Mean paired difference (BM25 - TF-IDF)'])-0.0118) < 1e-9
          assert abs(float(vals['Paired t-test p-value'])-0.46) < 1e-9
          shifts=pd.read_csv(a/'table_18_stage2_rank_shifts.csv')
          r=shifts.loc[shifts['canonical_id']==76].iloc[0]
          assert int(r['rank_change'])==9
          labels=pd.read_csv('potential-talents-labelled.csv')
          assert len(labels)==104
          assert labels['final_revised_grade'].value_counts().sort_index().to_dict()=={0:27,1:10,2:47,3:20}
          print('Analytical audit passed: selected NDCG@10=0.959602, MAP@10=1.0, MRR=1.0, BM25 delta=0.0118 (p=0.46), ID 76 rank shift=+9.')
          PY

          echo '6/8 Building the approved reports from notebook-derived evidence'
          sed -i "s#A=Path('/mnt/data/hr_project_assets')#A=Path('assets')#" create_final_reports.py
          sed -i "s#BUILD=Path('/mnt/data/hr_report_build'); BUILD.mkdir(exist_ok=True)#BUILD=Path('build'); BUILD.mkdir(exist_ok=True)#" create_final_reports.py
          python create_final_reports.py
          libreoffice --headless --convert-to pdf --outdir . build/Technical_Report.docx
          sed -i "s#OUT='/mnt/data/Business_Recommendations_CORPORATE_PREVIEW_V12.pdf'#OUT='Business_Recommendations.pdf'#" build_business_corporate_preview_v12.py
          python build_business_corporate_preview_v12.py
          test -s Technical_Report.pdf
          test -s Business_Recommendations.pdf
          test "$(pdfinfo Technical_Report.pdf | awk '/^Pages:/ {print $2}')" = '13'
          test "$(pdfinfo Business_Recommendations.pdf | awk '/^Pages:/ {print $2}')" = '4'
          pdftotext Technical_Report.pdf /tmp/tech.txt
          pdftotext Business_Recommendations.pdf /tmp/biz.txt
          grep -q '0.9596' /tmp/tech.txt
          grep -q '0.0118' /tmp/tech.txt
          grep -q 'NDCG@10' /tmp/biz.txt

          echo '7/8 Replacing repository root with exactly the ten approved deliverables'
          rm -f create_final_reports.py build_business_corporate_preview_v12.py build_nb1_assets.py
          rm -rf assets build
          mkdir -p /tmp/final10
          cp .gitignore \
             01_data_representation.ipynb \
             02_grouped_cv_model_selection.ipynb \
             03_final_ranking_stage2.ipynb \
             Business_Recommendations.pdf \
             README.md \
             Technical_Report.pdf \
             potential-talents-labelled.csv \
             potential-talents.csv \
             requirements.txt /tmp/final10/

          cd "$GITHUB_WORKSPACE"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/final10/. .

          python - <<'PY'
          from pathlib import Path
          expected={
            '.gitignore','01_data_representation.ipynb','02_grouped_cv_model_selection.ipynb',
            '03_final_ranking_stage2.ipynb','Business_Recommendations.pdf','README.md',
            'Technical_Report.pdf','potential-talents-labelled.csv','potential-talents.csv','requirements.txt'
          }
          actual={p.name for p in Path('.').iterdir() if p.name!='.git'}
          assert actual==expected, (sorted(actual),sorted(expected))
          readme=Path('README.md').read_text(encoding='utf-8')
          for name in expected:
            assert name in readme, f'{name} missing from README repository structure'
          print('Root-structure audit passed: exactly 10 files and README references every file.')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize Human Resources Candidate Ranking repository'
          git push origin HEAD:main

          echo '8/8 Verifying the repository has only main'
          heads="$(git ls-remote --heads origin | awk '{print $2}' | sed 's#refs/heads/##' | sort)"
          echo "Remote branches after cleanup:"
          echo "$heads"
          test "$heads" = 'main'
          echo 'FINAL REPOSITORY CLEANUP PASSED.'
