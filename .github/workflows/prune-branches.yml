name: Prune temporary branches

on:
  push:
    paths:
      - CLEAN_BRANCHES_NOW

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete every remote branch except main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branches="$(git ls-remote --heads origin | awk '{print $2}' | sed 's#refs/heads/##' | grep -v '^main$' || true)"
          if [ -n "$branches" ]; then
            while IFS= read -r branch; do
              [ -z "$branch" ] && continue
              echo "Deleting $branch"
              git push origin --delete "$branch"
            done <<< "$branches"
          fi
          remaining="$(git ls-remote --heads origin | awk '{print $2}' | sed 's#refs/heads/##' | sort)"
          echo "Remaining branches:"
          echo "$remaining"
          test "$remaining" = 'main'
