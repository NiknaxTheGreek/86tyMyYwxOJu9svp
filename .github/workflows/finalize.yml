name: Finalize repository

on:
  push:
    paths:
      - FINALIZE_NOW

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild final repository
        shell: bash
        run: |
          set -euo pipefail
          cat .finalstage/chunk_* > /tmp/final.b64
          base64 -d /tmp/final.b64 > /tmp/final.zip
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          unzip -q /tmp/final.zip -d .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Human Resources Candidate Ranking project"
          git push origin HEAD:main
