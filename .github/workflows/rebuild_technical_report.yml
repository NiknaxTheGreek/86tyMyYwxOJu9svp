name: Rebuild dense Technical Report

on:
  push:
    paths:
      - '.github/workflows/rebuild_technical_report.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build PDF
        run: |
          python -m pip install --quiet reportlab
          python .github/build_technical_report.py
      - name: Commit report and clean temporary builder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Technical_Report.pdf
          git rm .github/build_technical_report.py .github/workflows/rebuild_technical_report.yml
          git commit -m "Expand Technical Report to nine dense pages"
          git push
