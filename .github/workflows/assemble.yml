name: Assemble final repository

on:
  push:
    paths:
      - ASSEMBLE_NOW

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble final deliverables
        shell: bash
        run: |
          set -euo pipefail
          cat .upload/chunk_* > archive.b64
          base64 -d archive.b64 > final.zip
          rm archive.b64
          rm -rf extracted
          mkdir extracted
          unzip -q final.zip -d extracted
          cp -a extracted/Wa_BVVFTGqd_OVCYjY/. .
          rm -rf extracted final.zip .upload ASSEMBLE_NOW .github/workflows/assemble.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Upload final Human Resources Candidate Ranking deliverables"
          git push origin HEAD:main
